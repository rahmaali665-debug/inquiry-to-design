<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>من الاستقصاء إلى التصميم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700;800&display=swap">
<style>
/* Layout: a blueprint desk holding an engineer's notebook. Navy covers wired like a real circuit;
   graph-paper pages for two inquiries and three designs, each with a working model. */
:root {
  --desk: #091d36;
  --desk-2: #10305a;
  --grid: rgba(170, 205, 245, 0.06);
  --ink: #eef4fc;
  --muted: #a8c0dc;
  --accent: #8cc0f5;
  --glow: #ffd45a;
  --panel: rgba(8, 26, 48, 0.66);
  --panel-line: rgba(140, 192, 245, 0.28);
  --shade: rgba(2, 10, 22, 0.6);
  --paper: #fcfdff;
  --paper-ink: #1d3047;
  --paper-muted: #50637a;
  --frame: #4a7ebb;
  --frame-fill: #dbeff4;
  --line2: #c6d7ea;
  --navy: #0f2f55;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --font-head: "Noto Kufi Arabic", "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 15px;
  background-color: var(--desk);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    radial-gradient(ellipse at 50% 40%, var(--desk-2) 0%, var(--desk) 72%);
  background-size: 28px 28px, 28px 28px, 100% 100%;
  background-attachment: fixed;
}
.app {
  min-height: 100%; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
  padding-block: 12px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 10px 14px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.bulbico { width: 36px; height: 36px; flex: none; filter: drop-shadow(0 0 8px rgba(255, 212, 90, 0.55)); }
h1 { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; margin: 0; line-height: 1.5; text-wrap: balance; }
.picker { display: flex; align-items: center; gap: 8px; min-width: 0; }
.picker label { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
select { font: inherit; font-size: 0.9rem; color: var(--ink); background: #0c2443; border: 1px solid var(--panel-line); border-radius: 10px; padding: 7px 10px; max-width: min(380px, 70vw); }
.where { text-align: center; font-family: var(--font-head); font-weight: 500; font-size: 0.95rem; color: var(--accent); min-height: 1.6em; }
.stage { flex: 1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; min-height: 0; }
.bookwrap { width: 100%; margin-inline: auto; filter: drop-shadow(0 16px 30px var(--shade)); }
#book { transform: scaleX(-1); }   /* mirrored so the book opens right-to-left like an Arabic book */

/* ---------- pages ---------- */
.page { background: var(--paper); container-type: size; overflow: hidden; }
.pg { position: absolute; inset: 0; transform: scaleX(-1); direction: rtl; color: var(--paper-ink); font-family: var(--font-body); }
.zbox .pg { transform: none; }
.pg svg.art { position: absolute; inset: 0; width: 100%; height: 100%; direction: ltr; }
.pg svg { direction: ltr; }
.pg.paper {
  background-color: var(--paper);
  background-image: linear-gradient(rgba(74, 126, 187, 0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(74, 126, 187, 0.09) 1px, transparent 1px);
  background-size: 3.2cqw 3.2cqw;
}
.wrap { position: absolute; inset: 4% 5.5% 5%; display: flex; flex-direction: column; gap: 1.15cqw; }
.tagrow { display: flex; gap: 1cqw; flex-wrap: wrap; align-items: center; }
.tag { font-family: var(--font-head); font-weight: 700; font-size: 2cqw; background: var(--navy); color: #fff; border-radius: 5cqw; padding: 0.45cqw 1.8cqw; }
.tag.soft { background: var(--frame-fill); color: var(--navy); border: 0.2cqw solid var(--frame); font-weight: 600; }
h2.q { font-family: var(--font-head); font-weight: 800; font-size: 3.4cqw; line-height: 1.45; margin: 0.4cqw 0 0; color: var(--navy); text-wrap: balance; }
h2.q.one { white-space: nowrap; font-size: 2.95cqw; }
.vars { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 0.9cqw; }
.var { background: #fff; border: 0.2cqw solid var(--line2); border-radius: 1.3cqw; padding: 0.5cqw 1.1cqw; font-size: 1.85cqw; line-height: 1.42; }
.var b { display: block; color: var(--frame); font-size: 1.75cqw; font-weight: 600; }
.cols { display: grid; grid-template-columns: 1.25fr 1fr; gap: 1.6cqw; align-items: start; }
.box { background: rgba(255, 255, 255, 0.9); border: 0.22cqw solid var(--frame); border-radius: 1.8cqw; padding: 1.1cqw 1.5cqw; }
.box h3 { font-family: var(--font-head); font-size: 2.45cqw; margin: 0 0 0.8cqw; color: var(--navy); }
.steps { list-style: none; margin: 0; padding: 0; position: relative; display: flex; flex-direction: column; gap: 0.75cqw; counter-reset: s; }
.steps::before { content: ""; position: absolute; inset-inline-start: 1.75cqw; top: 1.8cqw; bottom: 1.8cqw; width: 0.45cqw; border-radius: 1cqw; background: linear-gradient(#c62828, #263238); }
.steps li { position: relative; padding-inline-start: 5cqw; font-size: 2cqw; line-height: 1.45; counter-increment: s; min-height: 3.8cqw; }
.steps li::before {
  content: counter(s); position: absolute; inset-inline-start: 0; top: 0; width: 3.9cqw; height: 3.9cqw; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff2b0, #e2b33c 55%, #8a6512); color: #3b2a00; font-weight: 700; font-size: 2.1cqw;
  display: grid; place-items: center; box-shadow: 0 0.3cqw 0.8cqw rgba(0, 0, 0, 0.25);
}
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8cqw; }
.tool { background: #fff; border: 0.2cqw solid var(--line2); border-radius: 1.3cqw; padding: 0.4cqw 0.4cqw 0.6cqw; text-align: center; font-size: 1.9cqw; font-weight: 600; color: var(--navy); line-height: 1.35; }
.tool svg { width: 100%; height: 8cqw; display: block; }
.model { background: linear-gradient(160deg, #143b66, #0d2747); border-radius: 1.8cqw; padding: 1cqw 1.2cqw 1.1cqw; color: #fff; display: flex; flex-direction: column; gap: 0.8cqw; box-shadow: 0 0.6cqw 1.6cqw rgba(15, 47, 85, 0.25); }
.model .mhead { display: flex; align-items: center; justify-content: space-between; gap: 1cqw; flex-wrap: wrap; }
.model h3 { font-family: var(--font-head); font-size: 2.35cqw; margin: 0; color: #fff; }
.model .hint2 { font-size: 1.8cqw; color: #a8c0dc; }
.model svg { width: 100%; height: auto; display: block; border-radius: 1.2cqw; }
.mrow { display: flex; gap: 1cqw; align-items: center; justify-content: center; flex-wrap: wrap; }
.mbtn { font: inherit; font-family: var(--font-body); font-size: 2cqw; padding: 0.6cqw 1.8cqw; border-radius: 1.4cqw; border: 0.2cqw solid #8cc0f5; background: #16426f; color: #fff; cursor: pointer; }
.mbtn:hover { border-color: #ffd45a; }
.mbtn.on { background: #ffd45a; color: #0b2140; border-color: #ffd45a; font-weight: 700; }
.status { font-size: 2cqw; color: #ffd45a; text-align: center; min-height: 2.8cqw; }
.concl { background: linear-gradient(135deg, #fff8dc, #ffefb0); border: 0.3cqw solid #e2b33c; border-radius: 1.8cqw; padding: 1cqw 1.8cqw; font-size: 2.2cqw; line-height: 1.6; }
.concl .lbl { font-family: var(--font-head); font-weight: 700; color: #7a4f00; }
.concl .then { display: block; margin-top: 0.3cqw; color: var(--navy); font-size: 2cqw; font-weight: 600; }
.split { display: grid; grid-template-columns: 1.7fr 1fr; gap: 1cqw; align-items: center; }
table.rec { width: 100%; border-collapse: collapse; font-size: 1.85cqw; background: rgba(255, 255, 255, 0.06); border-radius: 1cqw; overflow: hidden; }
table.rec th, table.rec td { border: 0.15cqw solid rgba(140, 192, 245, 0.35); padding: 0.45cqw 0.6cqw; text-align: center; }
table.rec th { color: #cfe3fa; font-weight: 600; }
table.rec tr.cur td { background: rgba(255, 212, 90, 0.18); color: #ffd45a; font-weight: 700; }
.cmp { font-size: 1.9cqw; text-align: center; color: #cfe3fa; min-height: 2.6cqw; }
.cmp b { color: #ffd45a; font-size: 2.3cqw; letter-spacing: 0.04em; }
.prob { background: #fff; border: 0.2cqw solid var(--line2); border-inline-start: 1cqw solid var(--frame); border-radius: 1.4cqw; padding: 1cqw 1.8cqw; font-size: 2.3cqw; line-height: 1.65; box-shadow: 0 0.4cqw 1cqw rgba(15, 47, 85, 0.08); }
.prob .lbl, .sol .lbl { font-family: var(--font-head); font-weight: 700; color: var(--frame); }
.sol { font-size: 2.15cqw; line-height: 1.6; }
.dt { display: flex; gap: 1.3cqw; }
.dt .st { flex: 1; background: #fff; border: 0.2cqw solid var(--frame); border-radius: 1.3cqw; padding: 0.6cqw 0.5cqw; text-align: center; font-size: 1.75cqw; line-height: 1.4; position: relative; }
.dt .st b { display: block; font-family: var(--font-head); color: var(--navy); font-size: 1.95cqw; }
.dt .st:not(:last-child)::after { content: "←"; position: absolute; inset-inline-end: -1.3cqw; top: 38%; color: #c99a1c; font-size: 1.9cqw; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 0.7cqw; }
.chip { font-size: 1.8cqw; background: var(--frame-fill); border: 0.2cqw solid var(--frame); border-radius: 5cqw; padding: 0.3cqw 1.3cqw; }
.chip b { color: var(--navy); }
.sw { display: inline-block; width: 1.5cqw; height: 1cqw; border: 0.15cqw solid #6f86a3; vertical-align: middle; margin: 0 0.1cqw; }
.swrow { display: inline-flex; gap: 0.25cqw; vertical-align: middle; margin-inline-start: 0.6cqw; }
.comic { position: absolute; inset: 2.2% 3.5% 5.2%; display: flex; align-items: center; justify-content: center; }
.comic img { max-width: 100%; max-height: 100%; object-fit: contain; border: 0.25cqw solid var(--paper-ink); border-radius: 0.8cqw; }
.lk { position: absolute; inset: 4% 5.5% 5%; display: flex; flex-direction: column; gap: 1cqw; }
.lk .lead { display: none; }
.lk .hub { align-self: center; text-align: center; background: var(--frame-fill); border: 0.35cqw solid var(--frame); border-radius: 2cqw; padding: 0.7cqw 3cqw; font-size: 2.1cqw; line-height: 1.5; max-width: 80%; }
.lk .hub b { display: block; font-family: var(--font-head); color: var(--navy); font-size: 2.5cqw; }
.lk .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2cqw; }
.lk .card { background: #fff; border: 0.2cqw solid #d5e1ee; border-inline-start: 1.1cqw solid var(--c); border-radius: 1.4cqw; padding: 1cqw 1.5cqw; font-size: 2.15cqw; line-height: 1.5; }
.lk .card.wide { grid-column: 1 / -1; }
.lk .card h4 { margin: 0; font-family: var(--font-head); font-size: 2.8cqw; color: var(--c); }
.lk .card .src { font-size: 1.95cqw; color: var(--paper-muted); }
.lk .card .obj { display: inline-block; font-size: 1.75cqw; font-weight: 700; color: var(--c); border: 0.2cqw solid var(--c); border-radius: 3cqw; padding: 0 1.2cqw; margin-top: 0.4cqw; }
.lk .card .how { margin-top: 0.5cqw; }
.lk .card .how b { color: var(--navy); }
.lk .go { margin-top: 0.7cqw; font: inherit; font-size: 1.9cqw; font-weight: 700; color: #fff; background: var(--c); border: 0; border-radius: 3cqw; padding: 0.4cqw 1.8cqw; }
.lk .job { margin-top: auto; background: var(--navy); color: #fff; border-radius: 1.6cqw; padding: 1cqw 2cqw; font-size: 2.15cqw; line-height: 1.5; }
.lk .job b { color: var(--glow); }
.pfoot { position: absolute; inset: auto 5.5% 1.6%; display: flex; justify-content: space-between; font-size: 1.7cqw; color: var(--paper-muted); }
/* model state switches */
.pg:not([data-s="on"]) .c1-on, .pg[data-s="on"] .c1-off { display: none; }
.pg:not([data-lamp="on"]) .l-on, .pg[data-lamp="on"] .l-off { display: none; }
.pg:not([data-r1="on"]) .r1-on, .pg[data-r1="on"] .r1-off { display: none; }
.pg:not([data-r2="on"]) .r2-on, .pg[data-r2="on"] .r2-off { display: none; }
.lit { transition: opacity 0.5s ease; }
.pg:not([data-lamp="on"]) .lit-lamp, .pg:not([data-r1="on"]) .lit-r1, .pg:not([data-r2="on"]) .lit-r2 { opacity: 0; }
[data-act] { cursor: pointer; }
.scrap, .fish { transition: transform 0.6s cubic-bezier(.3, 1.4, .5, 1), opacity 0.4s ease; transform-box: fill-box; transform-origin: center; }
.chg { transition: opacity 0.3s ease; }
.wool.rubbing { animation: rub 0.9s ease-in-out; }
@keyframes rub { 0% { transform: translate(0, 0); } 25% { transform: translate(170px, -6px); } 50% { transform: translate(360px, 0); } 75% { transform: translate(170px, 6px); } 100% { transform: translate(0, 0); } }
/* navy pages */
.pg.navy { color: #fff; }
.txt { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2cqw; }
.txt.cover { inset: 38% 15% 20.5%; gap: 1.4cqw; }
.txt.cover .small { font-size: 2.35cqw; }
.txt.cover .eyebrow { font-size: 2.6cqw; max-width: 66%; line-height: 1.5; }
.txt.cover .ttl { font-size: 8.4cqw; line-height: 1.25; }
.txt.back { inset: 14% 10% 12%; gap: 3cqw; }
.eyebrow { font-family: var(--font-head); font-weight: 500; font-size: 3.2cqw; letter-spacing: 0.04em; color: var(--glow); }
.ttl { font-family: var(--font-head); font-weight: 800; font-size: 9cqw; line-height: 1.35; text-shadow: 0 0.4cqw 1.6cqw rgba(0, 0, 0, 0.35); text-wrap: balance; }
.sub2 { font-family: var(--font-head); font-weight: 500; font-size: 4.2cqw; color: #cfe3fa; line-height: 1.5; }
.rule { width: 30%; height: 0.35cqw; border-radius: 1cqw; background: linear-gradient(to left, transparent, var(--glow), transparent); margin-block: 0.6cqw; }
.small { font-size: 2.6cqw; color: #b9cfe8; line-height: 1.6; }
.flow { display: flex; flex-direction: column; align-items: center; gap: 1.2cqw; }
.flow span { font-family: var(--font-head); font-weight: 700; font-size: 3.6cqw; background: rgba(255, 255, 255, 0.08); border: 0.25cqw solid rgba(156, 198, 242, 0.55); border-radius: 5cqw; padding: 0.8cqw 4cqw; }
.flow span.hot { background: var(--glow); color: #0b2140; border-color: var(--glow); box-shadow: 0 0 3cqw rgba(255, 212, 90, 0.5); }
.flow i { font-style: normal; color: var(--glow); font-size: 3.4cqw; line-height: 1; }


/* inquiry pages v2 */
.qhead { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.9cqw; }
.qhead h2.q { text-align: center; margin: 0; }
.qhead .tagrow { justify-content: center; }
.tag.dk { background: #1f4f86; color: #fff; border: 0; font-weight: 600; }
.steps li::before { content: counter(s, arabic-indic); }
.steps li { font-size: 2.3cqw; }
.toolsv { display: flex; flex-direction: column; gap: 0.8cqw; }
.toolsv .tool { display: grid; grid-template-columns: 46% 1fr; align-items: center; text-align: start; padding: 0.4cqw 1cqw 0.4cqw 0.6cqw; font-size: 2.1cqw; }
.toolsv .tool svg { height: 9cqw; }
.sheet { background: #fff; border: 0.22cqw solid var(--frame); border-radius: 1.8cqw; padding: 1cqw 1.3cqw 1.2cqw; display: flex; flex-direction: column; gap: 0.8cqw; }
.sheet .sh { display: flex; align-items: center; justify-content: space-between; gap: 1cqw; flex-wrap: wrap; }
.sheet .sh b { font-family: var(--font-head); font-size: 2.35cqw; color: var(--navy); }
.badge { font-size: 1.8cqw; border-radius: 3cqw; padding: 0.25cqw 1.3cqw; font-weight: 600; }
.badge.pre { background: #fff1c9; color: #7a4f00; border: 0.2cqw solid #e2b33c; }
.badge.post { background: #ddf3e4; color: #1b5e20; border: 0.2cqw solid #66bb6a; }
.sheet .ins { font-size: 1.95cqw; color: var(--paper-muted); }
table.rt { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 2.05cqw; background: #fff; }
table.rt th, table.rt td { border: 0.22cqw solid #9fb6d1; padding: 0.6cqw 0.5cqw; text-align: center; line-height: 1.4; }
table.rt th { background: var(--navy); color: #fff; font-weight: 600; font-size: 1.9cqw; }
table.rt th small { display: block; font-weight: 400; font-size: 1.65cqw; color: #cfe3fa; }
table.rt td.do { text-align: start; }
.pill { display: inline-block; padding: 0.1cqw 1cqw; border: 0.2cqw dashed #9fb6d1; border-radius: 3cqw; margin: 0.2cqw; font-size: 1.85cqw; color: var(--paper-muted); white-space: nowrap; }
.pill.pick { border: 0.36cqw solid #1565c0; color: #0d47a1; font-weight: 700; }
.blank { display: inline-block; width: 55%; height: 2.6cqw; border-bottom: 0.28cqw dotted #50637a; }
.num { font-size: 2.7cqw; font-weight: 700; color: #0d47a1; }
.cmpl { display: flex; align-items: center; justify-content: center; gap: 1cqw; flex-wrap: wrap; font-size: 2.05cqw; }
.cmpl .bx { display: inline-grid; place-items: center; width: 3.6cqw; height: 3.6cqw; border: 0.28cqw solid #50637a; border-radius: 0.8cqw; font-weight: 700; color: #0d47a1; }
.cmpl .gap { display: inline-block; width: 5cqw; border-bottom: 0.28cqw dotted #50637a; height: 2.6cqw; }
.cmpl small { color: var(--paper-muted); font-size: 1.8cqw; }
.note2 { font-size: 1.9cqw; color: var(--paper-muted); text-align: center; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2cqw; }
.cpanel { background: rgba(255, 255, 255, 0.06); border: 0.2cqw solid rgba(140, 192, 245, 0.4); border-radius: 1.4cqw; padding: 0.8cqw; display: flex; flex-direction: column; align-items: center; gap: 0.6cqw; }
.cpanel .cl { font-family: var(--font-head); font-weight: 700; font-size: 2.3cqw; }
.cpanel .cs { font-size: 1.95cqw; color: #ffd45a; min-height: 2.6cqw; }
.cpanel[data-c="open"] .c-on, .cpanel[data-c="closed"] .c-off { display: none; }
.cpanel[data-c="open"] .cl { color: #cfe3fa; }
.cpanel[data-c="closed"] .cl { color: #ffd45a; }
.cpanel[data-c="closed"] { border-color: #ffd45a; }
.wrap.roomy { gap: 1cqw; }
.wrap.roomy .steps { gap: 0.7cqw; }
.wrap.roomy .steps li { font-size: 2.3cqw; }
.wrap.roomy .toolsv .tool { font-size: 2.35cqw; }
.wrap.roomy .toolsv .tool svg { height: 7.5cqw; }
.wrap.roomy .var { font-size: 1.9cqw; }
.wrap.roomy table.rt { font-size: 2.3cqw; }
.wrap.roomy table.rt th, .wrap.roomy table.rt td { padding: 0.55cqw 0.4cqw; }
.wrap.roomy .pill { font-size: 2cqw; }
.wrap.roomy .sheet .ins, .wrap.roomy .cmpl { font-size: 2.2cqw; }
.qhead .tagrow { gap: 1cqw; row-gap: 0.8cqw; }

    { t: 'paper', label: 'الاستقصاء (1): السؤال والخطوات والأدوات', html: '<div class="wrap roomy"><div class="qhead"><div class="tagrow"><span class="tag t1">الاستقصاء (١)</span><span class="tag t2">تجريبي هيكلي (Herron, 1971)</span><span class="tag t3">بديل لاستقصاء «أستكشف» في الكتاب</span></div><h2 class="q one">كيف تؤثر حالة الدائرة (مفتوحة أو مغلقة) في إضاءة المصباح؟</h2></div><div class="vars"><div class="var"><b>المتغير المستقل</b>حالة الدائرة؛ وفي أستكشف أكثر: عدد المصابيح</div><div class="var"><b>المتغير التابع</b>إضاءة المصباح؛ وفي أستكشف أكثر: شدة الإضاءة</div><div class="var"><b>ضبط المتغيرات</b>البطارية والمصباح والسلكان؛ وفي أستكشف أكثر: البطارية نفسها ونوع المصابيح</div></div><div class="cols"><div class="box"><h3>الخطوات</h3><ol class="steps"><li>يُحضِر المعلم بطارية وسلكين مكشوفَي الطرفين ومصباحًا صغيرًا يناسب جهدها مثبتًا في قاعدته، ويقدّم السؤال، ويطلب من التلاميذ أن يتوقعوا.</li><li>يوصل التلاميذ الدائرة، مع تنبيههم إلى ألا يصلوا طرفي البطارية بسلك وحده.</li><li>يفصلون طرف سلك ويعيدونه، ويسجلون في جدول هل يضيء المصباح أو لا.</li><li>أستكشف أكثر (د/ص. 103): يضيفون مصباحًا ثانيًا وسلكًا ثالثًا في المسار نفسه، ويقارنون الإضاءة.</li></ol></div><div class="box"><h3>الأدوات</h3><div class="toolsv">' + tool(I.battery, 'بطارية') + '' + tool(I.lamp, 'مصباح صغير يناسب جهد البطارية') + '' + tool(I.wires, 'سلكان، وثالث مع مصباح ثانٍ في أستكشف أكثر') + '</div></div></div><div class="sheet pre"><div class="sh"><b>جدول تسجيل الملاحظة</b><span class="badge pre">قبل التنفيذ: ورقة التلميذ</span></div><div class="ins">يتوقع التلميذ أولًا، ثم يجرّب، ثم يضع دائرة حول الكلمة المناسبة.</div><table class="rt"><tr><th style="width:9%">المحاولة</th><th style="width:27%">ما أفعله</th><th style="width:14%">حالة الدائرة</th><th style="width:25%">توقّعي</th><th style="width:25%">ما لاحظته</th></tr><tr><td>١</td><td class="do">أصل طرفَي السلكين بالبطارية</td><td>مغلقة</td><td><span class="pill">يضيء</span><span class="pill">لا يضيء</span></td><td><span class="pill">يضيء</span><span class="pill">لا يضيء</span></td></tr><tr><td>٢</td><td class="do">أفصل طرف سلك عن البطارية</td><td>مفتوحة</td><td><span class="pill">يضيء</span><span class="pill">لا يضيء</span></td><td><span class="pill">يضيء</span><span class="pill">لا يضيء</span></td></tr><tr><td>٣</td><td class="do">أعيد طرف السلك إلى البطارية</td><td>مغلقة</td><td><span class="pill">يضيء</span><span class="pill">لا يضيء</span></td><td><span class="pill">يضيء</span><span class="pill">لا يضيء</span></td></tr></table></div></div>' + foot(1) },
    { t: 'paper', label: 'الاستقصاء (1): النموذج والنتائج والاستنتاج', html: '<div class="wrap"><div class="qhead"><div class="tagrow"><span class="tag t1">الاستقصاء (١)</span><span class="tag t3">التنفيذ والنتائج</span></div><h2 class="q">النموذج: من الرسم إلى الاستنتاج</h2></div><div class="model"><div class="mhead"><h3>جرّب الدائرتين</h3><span class="hint2">أغلق الدائرة المفتوحة وراقب المصباح</span></div>' + M1 + '</div><div class="sheet post"><div class="sh"><b>جدول تسجيل الملاحظة</b><span class="badge post">بعد التنفيذ: استجابات التلميذ</span></div><table class="rt"><tr><th style="width:12%">المحاولة</th><th style="width:30%">ما أفعله</th><th style="width:16%">حالة الدائرة</th><th style="width:21%">توقّعي</th><th style="width:21%">ما لاحظته</th></tr><tr><td>١</td><td class="do">أصل طرفَي السلكين بالبطارية</td><td>مغلقة</td><td><span class="pill pick">يضيء</span><span class="pill">لا يضيء</span></td><td><span class="pill pick">يضيء</span><span class="pill">لا يضيء</span></td></tr><tr><td>٢</td><td class="do">أفصل طرف سلك عن البطارية</td><td>مفتوحة</td><td><span class="pill pick">يضيء</span><span class="pill">لا يضيء</span></td><td><span class="pill">يضيء</span><span class="pill pick">لا يضيء</span></td></tr><tr><td>٣</td><td class="do">أعيد طرف السلك إلى البطارية</td><td>مغلقة</td><td><span class="pill pick">يضيء</span><span class="pill">لا يضيء</span></td><td><span class="pill pick">يضيء</span><span class="pill">لا يضيء</span></td></tr></table><div class="note2">الدائرة حول الكلمة هي إجابة التلميذ. في المحاولة ٢ توقّع أن يضيء المصباح، ولاحظ أنه لا يضيء.</div></div><div class="concl"><span class="lbl">الاستنتاج: </span>لا يضيء المصباح إلا في دائرة مغلقة، ويخفت ضوء مصباحين موصولَين في المسار نفسه.<span class="then">← وعليه يُبنى مفتاح التشغيل في المشكلتين ١ و٢، ودائرة مستقلة لكل غرفة في المشكلة ٢.</span></div></div>' + foot(2) },
    { t: 'paper', label: 'الاستقصاء (2): السؤال والخطوات والأدوات', html: '<div class="wrap roomy tight"><div class="qhead"><div class="tagrow"><span class="tag t1">الاستقصاء (٢)</span><span class="tag t2">تجريبي موجّه (Herron, 1971)</span><span class="tag t3">بديل لنشاط «أحرّك دودة ورقية» في الكتاب</span></div><h2 class="q">كيف يؤثر عدد مرات الدلك في عدد قصاصات الورق التي يرفعها جسم بلاستيكي؟</h2></div><div class="vars"><div class="var"><b>المتغير المستقل</b>عدد مرات الدلك</div><div class="var"><b>المتغير التابع</b>عدد القصاصات العالقة بالماصة بعد رفعها</div><div class="var"><b>ضبط المتغيرات</b>الماصة والصوف وطريقة الدلك، وحجم القصاصات ونوع ورقها وعددها الكلي، ومسافة التقريب حتى تلامس الماصة القصاصات، مع تبديل الماصة بأخرى مماثلة قبل كل محاولة</div></div><div class="cols"><div class="box"><h3>الخطوات</h3><ol class="steps"><li>يعرض المعلم موادَّ آمنة متنوعة (بلاستيكية وخشبية وأقمشة وورقًا رقيقًا ملوّنًا)، ويقدّم السؤال فقط.</li><li>يختار التلاميذ أدواتهم ويخططون ويحددون المتغيرات (المتوقع: ماصات وصوف وورق ملوّن).</li><li>يقصّون قصاصات متساوية، لونًا لكل محاولة.</li><li>يدلكون الماصة ٥ ثم ١٠ ثم ٢٠ مرة، ثم يقرّبونها ويرفعونها ببطء، ويعدّون القصاصات العالقة بها ويسجلونها.</li></ol></div><div class="box"><h3>الأدوات المتوقع اختيارها</h3><div class="toolsv">' + tool(I.ruler, 'ماصة بلاستيكية') + '' + tool(I.wool, 'صوف') + '' + tool(I.paper, 'قصاصات متساوية بثلاثة ألوان') + '</div></div></div><div class="sheet pre"><div class="sh"><b>جدول تسجيل الملاحظة</b><span class="badge pre">قبل التنفيذ: ورقة التلميذ</span></div><div class="ins">يدلك التلميذ الماصة، ثم يقرّبها من القصاصات، ثم يرفعها ببطء، ويكتب عدد القصاصات العالقة بها.</div><table class="rt"><tr><th style="width:20%">المحاولة</th><th style="width:40%">عدد مرات الدلك<small>المتغير المستقل</small></th><th style="width:40%">عدد القصاصات العالقة بالماصة<small>المتغير التابع</small></th></tr><tr><td>١</td><td>٥ مرات · <span class="sw" style="background:#ffffff"></span> أبيض</td><td><span class="blank"></span></td></tr><tr><td>٢</td><td>١٠ مرات · <span class="sw" style="background:#4f8fe0"></span> أزرق</td><td><span class="blank"></span></td></tr><tr><td>٣</td><td>٢٠ مرة · <span class="sw" style="background:#e04848"></span> أحمر</td><td><span class="blank"></span></td></tr></table><div class="cmpl">أقارن الأعداد: <span class="gap"></span><span class="bx"></span><span class="gap"></span><span class="bx"></span><span class="gap"></span><small>أضع &gt; أو &lt; أو =</small></div></div></div>' + foot(3) },
    { t: 'paper', label: 'الاستقصاء (2): النموذج والنتائج والاستنتاج', html: '<div class="wrap snug"><div class="qhead"><div class="tagrow"><span class="tag t1">الاستقصاء (٢)</span><span class="tag t3">التنفيذ والنتائج</span></div><h2 class="q">النموذج: من الرسم إلى الاستنتاج</h2></div><div class="model"><div class="mhead"><h3>جرّب الدلك</h3><span class="hint2">لكل محاولة لون: اضغط عدد الدلكات وراقب قصاصات لونه (أعداد توضيحية)</span></div>' + M2 + '<div class="mrow"><button class="mbtn" type="button" data-act="rub" data-n="5"><span class="sw" style="background:#ffffff"></span> ٥ دلكات</button><button class="mbtn" type="button" data-act="rub" data-n="10"><span class="sw" style="background:#4f8fe0"></span> ١٠ دلكات</button><button class="mbtn" type="button" data-act="rub" data-n="20"><span class="sw" style="background:#e04848"></span> ٢٠ دلكة</button></div><div class="status rubst">اختر عدد الدلكات</div></div><div class="sheet post"><div class="sh"><b>جدول تسجيل الملاحظة</b><span class="badge post">بعد التنفيذ: استجابات التلميذ</span></div><table class="rt"><tr><th style="width:20%">المحاولة</th><th style="width:40%">عدد مرات الدلك<small>المتغير المستقل</small></th><th style="width:40%">عدد القصاصات العالقة بالماصة<small>المتغير التابع</small></th></tr><tr><td>١</td><td>٥ مرات · <span class="sw" style="background:#ffffff"></span> أبيض</td><td><span class="num">٣</span> <span class="swrow"><span class="sw" style="background:#ffffff"></span><span class="sw" style="background:#ffffff"></span><span class="sw" style="background:#ffffff"></span></span></td></tr><tr><td>٢</td><td>١٠ مرات · <span class="sw" style="background:#4f8fe0"></span> أزرق</td><td><span class="num">٦</span> <span class="swrow"><span class="sw" style="background:#4f8fe0"></span><span class="sw" style="background:#4f8fe0"></span><span class="sw" style="background:#4f8fe0"></span><span class="sw" style="background:#4f8fe0"></span><span class="sw" style="background:#4f8fe0"></span><span class="sw" style="background:#4f8fe0"></span></span></td></tr><tr><td>٣</td><td>٢٠ مرة · <span class="sw" style="background:#e04848"></span> أحمر</td><td><span class="num">٧</span> <span class="swrow"><span class="sw" style="background:#e04848"></span><span class="sw" style="background:#e04848"></span><span class="sw" style="background:#e04848"></span><span class="sw" style="background:#e04848"></span><span class="sw" style="background:#e04848"></span><span class="sw" style="background:#e04848"></span><span class="sw" style="background:#e04848"></span></span></td></tr></table><div class="cmpl">أقارن الأعداد: <span class="num">٣</span><span class="bx">&lt;</span><span class="num">٦</span><span class="bx">&lt;</span><span class="num">٧</span></div><div class="note2">الأعداد مثال توضيحي لإجابة تلميذ.</div></div><div class="concl"><span class="lbl">الاستنتاج: </span>الماصة المشحونة بالكهرباء الساكنة تجذب الأجسام الخفيفة، ويزيد غالبًا عدد القصاصات التي ترفعها بزيادة الدلك.<span class="then">← فيُتّفق في اللعبة على عدد مرات دلك يكفي لرفع الأسماك الحمراء الأصعب رفعًا (المشكلة ٣).</span></div></div>' + foot(4) },
    { t: 'paper', label: 'المشكلة (1): مصباح أم سلمان بمفتاح كبير', attrs: { lamp: 'off' }, html:
      '<div class="wrap">' +
      '<div><div class="tagrow"><span class="tag t1 eq">المشكلة (1)</span><span class="tag t3 eq">من استنتاج الاستقصاء 1</span></div><h2 class="q">مصباح أم سلمان بمفتاح كبير</h2></div>' +
      '<div class="prob"><span class="lbl">نص المشكلة: </span>يريد علي صنع مصباح يعمل بالبطارية لجارته أم سلمان لتستعمله بجانب سريرها عند انقطاع الكهرباء، وتشغّله وتطفئه بمفتاح كبير تصل إليه يدها وهي مستلقية، ولا تزيد تكلفته على دينار. كيف يمكنه تصميم هذا المصباح؟</div>' +
      '<div class="model"><div class="mhead"><h3>النموذج المرسوم</h3><span class="hint2">اضغط المفتاح لتضيء غرفة أم سلمان</span></div>' + M3 +
      '<div class="mrow"><button class="mbtn" type="button" data-act="lamp">اضغط المفتاح</button></div><div class="status">المصباح مطفأ: الدائرة مفتوحة</div></div>' +
      '<div class="sol"><span class="lbl">الحل بالكتابة: </span>يصمم التلاميذ نموذجًا لمصباح من علبة كرتون تحمل الدائرة، بمفتاح من مشبك أوراق معدني ودبوسين نحاسيين يغلق الدائرة ويفتحها (استنتاج الاستقصاء 1)، ويُثبَّت على المشبك مقبض كبير من الكرتون، مع مراعاة أن يكون المفتاح كبيرًا سهل التحريك.</div>' +
      DT(['مع أم سلمان بتجربة تحريك مفاتيح صغيرة وهم مستلقون', 'يحددون المشكلة', 'للمفتاح بالعصف الذهني', 'يبنون المصباح', 'بتشغيله وهم مستلقون، ثم يحسّنونه']) +
      '</div>' + foot(5) },
    { t: 'paper', label: 'المشكلة (1): الربط عبر التخصصات', html: '<div class="lk"><div><div class="tagrow"><span class="tag t1 eq">المشكلة (1)</span><span class="tag t3 eq">الربط عبر التخصصات</span></div><h2 class="q">كيف تشارك المواد في صنع مصباح أم سلمان؟</h2></div><p class="lead">في المنتصف التصميم، وحوله ما يفعله التلميذ من كل مادة وهو يصمم.</p><div class="hub"><b>التصميم</b>مصباح بالبطارية من علبة كرتون تحمل الدائرة، بمفتاح كبير يغلقها ويفتحها</div><div class="cards"><div class="card" style="--c:#b4532f"><h4>التربية الفنية</h4><div class="src">الشكل الطيني المجسّم (ص. 99)</div><span class="obj">هدف نفس حركي</span><span class="obj">اتجاه نحو العمل: إتقان العمل اليدوي</span><div class="how"><b>في التصميم: </b>يشكّل من الصلصال قاعدة ثابتة للمصباح حتى لا ينقلب بجانب سرير أم سلمان.</div></div><div class="card" style="--c:#23795a"><h4>اللغة العربية</h4><div class="src">مهارتا الإجابة عن الأسئلة والتحدث (ص. 90، 79)</div><span class="obj">اتجاه نحو التعلم: حسن الاستماع وانتظار الدور في الإجابة</span><div class="how"><b>في التصميم: </b>يستمع إلى قصة «مصباح أم سلمان»، ويجيب عن أسئلة: كيف؟ وماذا؟ ثم يتحدث عن المصباح الكهربائي بوصفه اختراعًا أفاد الناس، وكيف استعمله في الدائرة التي بناها لأم سلمان.</div><button class="go" type="button" data-act="goto" data-to="قصة المشكلة (1)">اقرأ القصة وأسئلتها في الصفحات التالية ←</button></div><div class="card" style="--c:#2f62a8"><h4>الرياضيات</h4><div class="src">النقود (ص. 76–79)</div><span class="obj">اتجاه نحو التعلم: الدقة في العدّ والتحقق من المجموع</span><div class="how"><b>في التصميم: </b>يعدّ قيم القطع النقدية المعدنية اللازمة لشراء المواد عدًّا تصاعديًا، ويتحقق أن مجموعها لا يزيد على دينار.</div></div><div class="card" style="--c:#8a6512"><h4>التربية الإسلامية</h4><div class="src">الإحسان إلى الجيران (ص. 67–68) · مهارة الكتابة</div><span class="obj">اتجاه نحو العمل: الالتزام بالإحسان إلى الجار</span><div class="how"><b>في التصميم: </b>يكتب حديث «مَن كان يؤمن بالله واليوم الآخر فليُحسن إلى جاره» على بطاقة، ويلصقها على علبة الكرتون التي تحمل الدائرة، ثم يُهدي المصباح إلى جار كبير في السن.</div></div><div class="card wide" style="--c:#6a4c9c"><h4>التربية للمواطنة</h4><div class="src">عملة بلادي (ص. 105–111) · مهارة التعرّف</div><span class="obj">اتجاه نحو العمل: الحرص على التوفير</span><div class="how"><b>في التصميم: </b>يتعرّف القطع النقدية المعدنية البحرينية التي سيدفع بها ثمن مواد المصباح، ويدّخر نقوده باستعمال علبة كرتون مستعملة من البيت لتحمل الدائرة بدل شراء علبة جديدة.</div></div></div><div class="job"><b>المهنة: </b>فني الكهرباء، متخصص في تركيب الأسلاك، مهنة يرى التلميذ صاحبها في بيته، ويحتاج صاحبها إلى معرفة الدائرة المغلقة والمفتوحة؛ فيسمّيها التلميذ، ويربطها بتوصيل دائرة المصباح، ويشرح كيف يغلق المفتاح الدائرة.</div></div>' + foot(6) },
    { t: 'paper', label: 'قصة المشكلة (1): مصباح أم سلمان (1 من 3)', html: '<div class="comic"><img src="img/comic-1.jpg" alt="قصة مصباح أم سلمان، الصفحة الأولى: العاصفة وانقطاع الكهرباء"></div>' + foot(7) },
    { t: 'paper', label: 'قصة المشكلة (1): مصباح أم سلمان (2 من 3)', html: '<div class="comic"><img src="img/comic-2.jpg" alt="قصة مصباح أم سلمان، الصفحة الثانية: المشكلة وطلب علي من الأبطال"></div>' + foot(8) },
    { t: 'paper', label: 'قصة المشكلة (1): أسئلة الاستماع (3 من 3)', html: '<div class="comic"><img src="img/comic-q.jpg" alt="أسئلة الاستماع لقصة مصباح أم سلمان"></div>' + foot(9) },
    { t: 'paper', label: 'المشكلة (2): بيت مريم بضوء لا يخفت', attrs: { r1: 'on', r2: 'off' }, html:
      '<div class="wrap p2">' +

    if (!t) return;
    var root = t.closest('.pg'); if (!root || !ACT[t.getAttribute('data-act')]) return;
    lastTouch = Date.now();
    ACT[t.getAttribute('data-act')](root, t);
  }, true);
  // drag the straw towards the fish: a charged straw lifts the fish it comes close to
  var dragging = null;
  function svgPoint(svg, e) {
    var r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    return { x: (e.clientX - r.left) / r.width * vb.width, y: (e.clientY - r.top) / r.height * vb.height };
  }
  document.addEventListener('pointerdown', function (e) {
    var rod = e.target.closest ? e.target.closest('.rod') : null;
    if (!rod) return;
    var svg = rod.ownerSVGElement, p = svgPoint(svg, e);
    dragging = { rod: rod, svg: svg, root: rod.closest('.pg'), x0: p.x, y0: p.y, warned: false };
    rod.style.transition = 'none';
    try { rod.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  document.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = svgPoint(dragging.svg, e);
    var dx = Math.max(-40, Math.min(10, p.x - dragging.x0)), dy = Math.max(0, Math.min(120, p.y - dragging.y0));
    dragging.rod.setAttribute('transform', 'translate(' + (194 + dx) + ' ' + (24 + dy) + ')');
    var bottom = 68 + dy, root = dragging.root;
    Array.prototype.forEach.call(root.querySelectorAll('.fish:not([data-caught])'), function (f) {
      var b = f.getBBox();
      if (b.y - bottom < 8) {
        if (+(root.getAttribute('data-q') || 0) > 0) ACT.fish(root, f, bottom);
        else if (!dragging.warned) { dragging.warned = true; root.querySelector('.status').textContent = 'الماصة غير مشحونة فلا تجذب الأسماك: اضغط الصوف لتدلكها أولًا'; }
      }
    });
  });
  function endDrag() {
    if (!dragging) return;
    var rod = dragging.rod;
    rod.style.transition = 'transform 0.5s ease';
    rod.setAttribute('transform', 'translate(194 24)');
    setTimeout(function () { dragging = null; }, 0);
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  document.addEventListener('click', function (e) {
    if (Date.now() - lastTouch < 700) return;
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) return;
    var root = t.closest('.pg'); if (!root || !ACT[t.getAttribute('data-act')]) return;
    ACT[t.getAttribute('data-act')](root, t);
  });
  // presses on models and buttons must not start a page turn
  ['mousedown', 'touchstart'].forEach(function (ev) {
    book.addEventListener(ev, function (e) { if (e.target.closest && e.target.closest('.model, [data-act]')) e.stopPropagation(); }, { capture: true, passive: true });
  });
  // on touch screens the page-flip library cancels the tap at touchend, so the browser never sends the click:
  // keep touchend on models, buttons and the zoom window away from it
  document.addEventListener('touchend', function (e) {
    if (e.target.closest && e.target.closest('.model, [data-act], button, select, #zoom')) e.stopPropagation();
  }, { capture: true });

  // ======================= book chrome =======================
  var toc = document.getElementById('toc');
  PAGES.forEach(function (p, i) { var o = document.createElement('option'); o.value = i; o.textContent = p.label; toc.appendChild(o); });
  var count = document.getElementById('count'), where = document.getElementById('where'), fill = document.getElementById('fill');
  var btns = { prev: [document.getElementById('prev'), document.getElementById('sidePrev')], next: [document.getElementById('next'), document.getElementById('sideNext')] };
  var pf = null;
  function update(i) {
    var two = pf && pf.getOrientation() === 'landscape' && i > 0 && i + 1 < total;
    count.textContent = (two ? ('الصفحتان ' + (i + 1) + '–' + (i + 2)) : ('الصفحة ' + (i + 1))) + ' من ' + total;
    btns.prev.forEach(function (b) { b.disabled = i <= 0; });
    btns.next.forEach(function (b) { b.disabled = i >= total - (two ? 2 : 1); });
    toc.value = String(i);
    where.textContent = two ? (PAGES[i].label + ' · ' + PAGES[i + 1].label) : PAGES[i].label;
    fill.style.width = (((two ? i + 2 : i + 1) / total) * 100).toFixed(1) + '%';
  }

  var flat = location.hash === '#flat';
  if (flat || typeof St === 'undefined' || !St.PageFlip) {
    book.style.transform = 'none'; book.className = 'fallback';
    ['bar', 'sidePrev', 'sideNext'].forEach(function (id) { document.getElementById(id).hidden = true; });
    document.querySelector('.hint').hidden = true; document.querySelector('.wire').hidden = true;
    toc.addEventListener('change', function () { book.children[+toc.value].scrollIntoView({ behavior: 'smooth' }); where.textContent = PAGES[+toc.value].label; });
    return;
  }

  var pageH = Math.max(320, Math.min(940, window.innerHeight - 240));
  var pageW = Math.round(pageH * 1000 / 1295);
  document.getElementById('bookwrap').style.maxWidth = (pageW * 2) + 'px';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  pf = new St.PageFlip(book, {
    width: pageW, height: pageH, size: 'stretch',
    minWidth: 200, maxWidth: pageW, minHeight: 259, maxHeight: pageH,
    showCover: true, usePortrait: true, mobileScrollSupport: true,
    maxShadowOpacity: 0.45, flippingTime: reduce ? 250 : 850, drawShadow: !reduce
  });
  pf.loadFromHTML(document.querySelectorAll('#book .page'));
  pf.on('flip', function (e) { update(e.data); });
  pf.on('changeOrientation', function () { update(pf.getCurrentPageIndex()); });
  update(0);

  btns.prev.forEach(function (b) { b.addEventListener('click', function () { pf.flipPrev(); }); });
  btns.next.forEach(function (b) { b.addEventListener('click', function () { pf.flipNext(); }); });
  toc.addEventListener('change', function () { var i = +toc.value; pf.turnToPage(i); update(i); });
  document.addEventListener('keydown', function (e) {
    if (!document.getElementById('zoom').hidden) { if (e.key === 'Escape') closeZoom(); return; }
    if (e.target === toc) return;
    if (e.key === 'ArrowLeft') pf.flipNext(); else if (e.key === 'ArrowRight') pf.flipPrev();
  });

  // zoom: a live copy of the page, so its models still work
  var zoom = document.getElementById('zoom'), zbox = document.getElementById('zbox');
  function closeZoom() { zoom.hidden = true; zbox.innerHTML = ''; document.getElementById('zoomBtn').focus(); }
  document.getElementById('zoomBtn').addEventListener('click', function () {
    var i = pf.getCurrentPageIndex();
    if (pf.getOrientation() === 'landscape' && i > 0 && i + 1 < total && PAGES[i].t !== 'paper' && PAGES[i + 1].t === 'paper') i = i + 1;
    var show = [i];
    if (pf.getOrientation() === 'landscape' && i + 1 < total && PAGES[i].t === 'paper' && PAGES[i + 1].t === 'paper') show.push(i + 1);
    zbox.innerHTML = '';
    show.forEach(function (k) { var b = document.createElement('div'); b.className = 'zbox'; b.appendChild(book.querySelectorAll('.pg')[k].cloneNode(true)); zbox.appendChild(b); });
    document.getElementById('zoomTitle').textContent = show.map(function (k) { return PAGES[k].label; }).join(' · ');
    zoom.hidden = false; zoom.scrollTop = 0; document.getElementById('zoomClose').focus();
  });
  document.getElementById('zoomClose').addEventListener('click', closeZoom);
})();
</script>

</body>
</html>
